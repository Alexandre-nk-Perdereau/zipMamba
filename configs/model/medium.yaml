model:
  name: zipmamba_medium
  input_dim: 80
  vocab_size: 5000

  d_state: 16
  d_conv: 4
  mamba_expand: 2
  ff_expand: 4
  conv_kernel_size: 31
  dropout: 0.1

  drop_path: 0.15

  use_intermediate_ctc: true
  intermediate_ctc_weight: 0.3

  stacks:
    - {dim: 192, blocks: 2, downsample: 2}   # 50 → 25 Hz
    - {dim: 320, blocks: 4, downsample: 2}   # 25 → 12.5 Hz
    - {dim: 384, blocks: 4, downsample: 2}   # 12.5 → 6.25 Hz
    - {dim: 384, blocks: 3, downsample: null} # bottleneck
    - {dim: 256, blocks: 2, upsample: 2}     # 6.25 → 12.5 Hz
    - {dim: 192, blocks: 3, upsample: 2}     # 12.5 → 25 Hz
